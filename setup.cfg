[flake8]
max-line-length = 100
extend-ignore = E203,W503,E501,W293,E302,F401,F811,F841,E722,E402
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    env,
    build,
    dist,
    *.egg-info,
    spirit_security.log,
    security_log.db

[bandit]
skips = B101,B301,B311,B110,B105,B403,B608,B307,B112
exclude_dirs = .git,venv,.venv,build,dist,__pycache__

[isort]
profile = black
line_length = 100
known_first_party = app
