name: Spirit Realm CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup & Test Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 2. Setup & Build Go Packet Service
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Packet Service
        working-directory: app/services/packet_service
        run: |
          go mod download
          go build ./...

      # 3. Build C Packet Inspector
      - name: Build C Packet Inspector
        working-directory: app/services/packet_inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          make

      # 4. Setup & Build Node.js Dashboard
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: app/dashboard
        run: npm ci
